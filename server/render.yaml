services:
  - type: web
    name: ibosys-api
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    # Puppeteer's install hook does not reliably download Chrome on Render.
    # Install it explicitly so PDF routes have a browser available at runtime.
    buildCommand: npm ci && PUPPETEER_CACHE_DIR=/opt/render/project/src/server/node_modules/.cache/puppeteer npx puppeteer browsers install chrome
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.23.2"
      - key: FRONTEND_URL
        sync: false
      - key: PORTAL_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/server/node_modules/.cache/puppeteer
      - key: SMS_OTP_MODE
        value: textbee
      - key: TEXTBEE_API_KEY
        sync: false
      - key: TEXTBEE_BASE_URL
        value: https://api.textbee.dev/api/v1
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ibosys-redis
          property: connectionString
  - type: keyvalue
    name: ibosys-redis
    plan: free
    region: singapore
    ipAllowList: []
