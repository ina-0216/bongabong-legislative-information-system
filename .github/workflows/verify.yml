# Verification pipeline for the iBOSys workspace.
#
# The portal's Vite build resolves @ibosys/design-tokens, @ibosys/ui and
# @ibosys/api to ../packages/*/dist. There is no npm workspace root, and each
# package has its own lockfile and tsup build, so a fresh clone has no dist/
# directories. They must be built before the portal build, or `npm run build`
# fails on unresolved aliases.
#
# This workflow runs for the full monorepo (client/, public-portal/, mobile-app/,
# packages/, server/ are all tracked in this repository). It is authoritative for
# the public-portal and package verification checks. See ci.yml for the broader
# cross-workspace CI pipeline covering all apps, packages, server tests, and linting.

name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of queueing them.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, budgets
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            public-portal/package-lock.json
            packages/design-tokens/package-lock.json
            packages/ui/package-lock.json
            packages/api/package-lock.json

      # Workspace packages must be built before the portal: the portal imports
      # their dist output. ui depends on design-tokens, so order matters.
      - name: Install and build design-tokens
        working-directory: packages/design-tokens
        run: |
          npm ci
          npm run build

      - name: Install and build ui
        working-directory: packages/ui
        run: |
          npm ci
          npm run build

      - name: Install and build api
        working-directory: packages/api
        run: |
          npm ci
          npm run build

      - name: Install portal dependencies
        working-directory: public-portal
        run: npm ci

      # lint -> vitest -> vite build -> bundle budget gate -> rendered DOM audit
      # -> visual diff. The budget gate fails on initial-JS regressions and on
      # fonts that are referenced but never emitted.
      #
      # Chromium must be installed BEFORE verify: the last two steps drive a
      # real browser, and `npm ci` does not download browsers.
      - name: Install Chromium
        working-directory: public-portal
        run: npx playwright install chromium

      - name: Verify portal
        working-directory: public-portal
        run: npm run verify

      - name: Bundle budget report
        working-directory: public-portal
        run: |
          npm run analyze
          node scripts/report-top.mjs 20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-report
          path: public-portal/dist/bundle-report.html
          retention-days: 14

      # Upload the captures and any diff images so a failed visual gate can be
      # inspected rather than guessed at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression
          path: |
            public-portal/.visual-baseline/current
            public-portal/.visual-baseline/diff
          retention-days: 14
